name: CI - Laravel MultiTenant

on:
  push:
    branches:
      - main
      - "*.x"
      - "*_ci"
  pull_request:
    branches:
      - main
      - "*.x"
      - "*_ci"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: 8.2
            server-type: nginx

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: testing
          MYSQL_USER: testing
          MYSQL_PASSWORD: testing
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mariadb:
        image: mariadb:latest
        env:
          MYSQL_DATABASE: testing
          MYSQL_USER: testing
          MYSQL_PASSWORD: testing
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3307:3306

      pgsql:
        image: postgres:14
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        ports:
          - 5432:5432

    env:
      DB_USERNAME: testing
      DB_PASSWORD: testing
      DB_DATABASE: testing
      APP_KEY: deela5kinohw0haekoothahSh8eexach

    steps:
      - uses: actions/checkout@v4

      - name: Detect Docker bridge IP and export as DB_HOST
        run: |
          BRIDGE_IP=$(ip route | grep default | awk '{print $3}')
          echo "DB_HOST=$BRIDGE_IP" >> $GITHUB_ENV
          echo "TENANCY_DB_HOST=$BRIDGE_IP" >> $GITHUB_ENV

      - name: Set DB env
        run: |
          echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_mysql, pdo_pgsql, gd, zip
          tools: composer
          coverage: none

      - name: Install dependencies
        run: composer install -n --prefer-dist --no-progress -o

      - name: Wait for DB
        run: sleep 10

      - name: Grant privileges
        run: |
          BRIDGE_IP=$(ip route | grep default | awk '{print $3}')

          # MariaDB (port 3307)
          mysql --host=127.0.0.1 --port=3307 -uroot -e "
            CREATE USER IF NOT EXISTS 'testing'@'$BRIDGE_IP' IDENTIFIED BY 'testing';
            GRANT ALL PRIVILEGES ON *.* TO 'testing'@'$BRIDGE_IP' WITH GRANT OPTION;
            FLUSH PRIVILEGES;
          "

          # MySQL (port 3306)
          mysql --host=127.0.0.1 --port=3306 -uroot -e "
            CREATE USER IF NOT EXISTS 'testing'@'$BRIDGE_IP' IDENTIFIED BY 'testing';
            GRANT ALL PRIVILEGES ON *.* TO 'testing'@'$BRIDGE_IP' WITH GRANT OPTION;
            FLUSH PRIVILEGES;
          "

      - name: Run PHPUnit (MySQL - mariadb)
        run: DB_CONNECTION=mysql DB_HOST=127.0.0.1 DB_PORT=3307 TENANCY_SYSTEM_CONNECTION_NAME=mysql ./vendor/bin/phpunit -c ci.phpunit.xml

      # - name: Debug via SSH (only on failure)
      #   if: ${{ always() }}
      #   uses: mxschmitt/action-tmate@v3
      #   timeout-minutes: 30

      - name: Run PHPUnit (MySQL - mysql)
        run: DB_CONNECTION=mysql DB_HOST=127.0.0.1 DB_PORT=3306 LIMIT_UUID_LENGTH_32=1 TENANCY_SYSTEM_CONNECTION_NAME=mysql ./vendor/bin/phpunit -c ci.phpunit.xml

      - name: Run PHPUnit (PostgreSQL)
        run: DB_CONNECTION=pgsql DB_HOST=127.0.0.1 TENANCY_SYSTEM_CONNECTION_NAME=pgsql ./vendor/bin/phpunit -c ci.phpunit.xml

      - name: Run PHPUnit (PostgreSQL - schema mode)
        run: DB_CONNECTION=pgsql DB_HOST=127.0.0.1 TENANCY_SYSTEM_CONNECTION_NAME=pgsql TENANCY_DATABASE_DIVISION_MODE=schema ./vendor/bin/phpunit -c ci.phpunit.xml tests/unit-tests/Database/ConnectionTest.php

  coverage:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:latest
        env:
          MYSQL_DATABASE: testing
          MYSQL_USER: testing
          MYSQL_PASSWORD: testing
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306

    env:
      DB_USERNAME: testing
      DB_PASSWORD: testing
      DB_DATABASE: testing
      APP_KEY: deela5kinohw0haekoothahSh8eexach

    steps:
      - uses: actions/checkout@v4

      - name: Detect Docker bridge IP and export as DB_HOST
        run: |
          BRIDGE_IP=$(ip route | grep default | awk '{print $3}')
          echo "DB_HOST=$BRIDGE_IP" >> $GITHUB_ENV
          echo "TENANCY_DB_HOST=$BRIDGE_IP" >> $GITHUB_ENV

      - name: Set up PHP with Xdebug
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: pdo_mysql, xdebug
          tools: composer
          coverage: xdebug

      - name: Install dependencies
        run: composer install -n --prefer-dist --no-progress -o

      - name: Wait for DB
        run: sleep 10

      - name: Grant privileges
        run: |
          BRIDGE_IP=$(ip route | grep default | awk '{print $3}')

          # MariaDB (port 3307)
          mysql --host=127.0.0.1 --port=3307 -uroot -e "
            CREATE USER IF NOT EXISTS 'testing'@'$BRIDGE_IP' IDENTIFIED BY 'testing';
            GRANT ALL PRIVILEGES ON *.* TO 'testing'@'$BRIDGE_IP' WITH GRANT OPTION;
            FLUSH PRIVILEGES;
          "

          # MySQL (port 3306)
          mysql --host=127.0.0.1 --port=3306 -uroot -e "
            CREATE USER IF NOT EXISTS 'testing'@'$BRIDGE_IP' IDENTIFIED BY 'testing';
            GRANT ALL PRIVILEGES ON *.* TO 'testing'@'$BRIDGE_IP' WITH GRANT OPTION;
            FLUSH PRIVILEGES;
          "

      - name: Grant privileges
        run: mysql --host=127.0.0.1 --port=3306 -uroot -e "grant all privileges on *.* to 'testing'@'%' with grant option;"

      - name: Run PHPUnit with coverage
        run: DB_CONNECTION=mysql DB_HOST=127.0.0.1 TENANCY_SYSTEM_CONNECTION_NAME=mysql ./vendor/bin/phpunit -c ci.phpunit.xml --coverage-clover=coverage.xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v3
